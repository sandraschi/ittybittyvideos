# Single Windows CI job — mirrors `just check` + webapp tsc/build.
# Public repo: sandraschi/ittybittyvideos

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint, test, webapp (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Pre-commit (all files)
        run: uv run pre-commit run --all-files

      - name: Pyright (non-blocking until types are green)
        continue-on-error: true
        run: uv run pyright src/

      - name: Pytest
        run: uv run pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Webapp typecheck and build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
        working-directory: webapp
